name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Game tests
        run: node --experimental-strip-types --test src/game/core/combat.test.ts src/game/core/expanses.test.ts src/game/core/crossing.test.ts src/game/core/skyweave.test.ts src/game/core/unwritten.test.ts src/game/core/hours.test.ts src/game/ui/art.test.ts src/game/ui/sprites.test.ts
      - name: Production build
        run: npm run build
        env:
          # Absent on purpose. scripts/migrate.mjs exits 0 without a database.
          DATABASE_URL: ""
      - name: Standalone GitHub Pages React build
        run: |
          npm run build:pages
          test -s dist-pages/index.html
          test -d dist-pages/assets
          node scripts/check-pages-style.mjs
      - name: Playwright smoke on the Pages build
        run: |
          npx playwright install --with-deps chromium
          npm run preview:pages -- --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null "http://127.0.0.1:4173/EchoesOfTheNine/" && break
            sleep 0.5
          done
          curl -sf -o /dev/null "http://127.0.0.1:4173/EchoesOfTheNine/"
          GAME_SMOKE_URL="http://127.0.0.1:4173/EchoesOfTheNine/" node scripts/hours-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hours-we-keep
          path: screenshots/hours-*.png
          if-no-files-found: ignore
